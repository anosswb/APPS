# Runs the type check and the tests of Paper Pines on every pull request that touches it.
name: Paper Pines checks

on:
  pull_request:
    paths:
      - 'apps/paper-puzzles/**'
      - '.github/workflows/paper-pines-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/paper-puzzles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/paper-puzzles/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
