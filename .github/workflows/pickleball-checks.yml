# Runs the type check and the tests of Dinkline (pickleball) on every pull request that touches it.
name: Dinkline (pickleball) checks

on:
  pull_request:
    paths:
      - 'apps/pickleball/**'
      - '.github/workflows/pickleball-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/pickleball
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pickleball/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
